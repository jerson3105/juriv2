<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Descanso de Jiro · Tutorial de Juried</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Reproductor de los tutoriales de Juried: escenario 16:9 escalado + barra de controles. */
:root {
  --night: #0b1026;
  --night-2: #141b3d;
  --sky: #1aa3ec;
  --sky-soft: #8fd3fb;
  --gold: #fbbf24;
  --violet: #6d5bd0;
  --violet-soft: #c4b5fd;
  --mint: #34d399;
  --rose: #fb7185;
  --ink: #0f172a;
  --paper: #ffffff;
  --line: #e2e8f0;
  --muted: #475569;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05081a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
#shell { position: fixed; inset: 0; display: flex; flex-direction: column; background: #05081a; }
#viewport { position: relative; flex: 1; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%;
  overflow: hidden; background: var(--night); color: #f8fafc;
}
#stage * { will-change: auto; }

/* Botón grande del inicio */
#big-play {
  position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; z-index: 20;
  display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border: 0; border-radius: 999px;
  background: var(--sky); color: #fff; font: 800 22px/1 'Inter', system-ui, sans-serif; cursor: pointer;
  box-shadow: 0 18px 50px rgba(26, 163, 236, .45);
}
#big-play[hidden] { display: none; }
#big-play:hover { filter: brightness(1.06); }
#big-play:focus-visible, #controls button:focus-visible, #range:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
#big-play svg { width: 26px; height: 26px; }

/* Barra de controles */
#controls { display: flex; align-items: center; gap: 12px; padding: 10px 16px 12px; background: #0b1026; border-top: 1px solid #1e2a5a; }
#controls button {
  display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 auto;
  border: 0; border-radius: 12px; background: #1b2550; color: #e2e8f0; cursor: pointer;
}
#controls button:hover { background: #26346e; }
#controls svg { width: 22px; height: 22px; }
#play[data-playing="true"] .i-play, #play[data-playing="false"] .i-pause { display: none; }
#mute[data-muted="true"] .i-sound, #mute[data-muted="false"] .i-muted, #mute:not([data-muted]) .i-muted { display: none; }
#bar { position: relative; flex: 1; height: 44px; display: flex; align-items: center; }
#range {
  --progress: 0%;
  width: 100%; height: 8px; margin: 0; appearance: none; -webkit-appearance: none; border-radius: 999px; cursor: pointer;
  background: linear-gradient(to right, var(--sky) var(--progress), #26346e var(--progress));
}
#range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--sky); }
#range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--sky); }
.tick {
  position: absolute; top: 50%; width: 6px !important; height: 18px !important; padding: 0; margin: 0;
  transform: translate(-50%, -50%); border-radius: 3px !important; background: var(--gold) !important; opacity: .9;
}
#meta { display: flex; flex-direction: column; min-width: 150px; line-height: 1.2; }
#time { font: 700 14px/1.2 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
#chapter { font: 600 13px/1.2 'Inter', system-ui, sans-serif; color: var(--sky-soft); white-space: nowrap; }
/* Pantallas angostas (celular o el modal en un teléfono): controles compactos para que la barra de progreso se vea. */
@media (max-width: 640px) {
  #controls { gap: 8px; padding: 6px 8px 8px; }
  #controls button { width: 36px; height: 36px; border-radius: 10px; }
  #controls svg { width: 18px; height: 18px; }
  #meta { min-width: 0; }
  #chapter { display: none; }
  #time { font-size: 12px; }
  #big-play { padding: 12px 20px; font-size: 17px; }
}
@media (max-width: 420px) { #meta { display: none; } }

/*
 * Base visual común de los tutoriales (la incluye build.mjs cuando escenas.html trae <!-- base: comun -->).
 * Escenario 1920×1080: cielo nocturno del tema espacial, portada, globo de Jiro, marco de la plataforma con su
 * barra lateral, cursor, subtítulos de pasos, avisos, celebración, consejos y cierre.
 * Nota: el motor anima con transform; nada que se anime debe centrarse con translate (usar margin: auto).
 */
#stage { font-family: 'Inter', system-ui, sans-serif; }
#stage.loading > * { opacity: 0; }
.abs { position: absolute; }

/* ---------- Cielo ---------- */
#sky {
  position: absolute; inset: 0;
  background:
    radial-gradient(1100px 700px at 72% 18%, rgba(67, 56, 202, .38), transparent 62%),
    radial-gradient(900px 600px at 12% 92%, rgba(56, 189, 248, .14), transparent 60%),
    #0b1026;
}
.star { position: absolute; border-radius: 50%; background: #fff; }
#constellation { position: absolute; left: 1210px; top: 70px; width: 600px; height: 320px; }
#constellation line { stroke: #fde68a; stroke-width: 2.5; stroke-linecap: round; }
#constellation circle { fill: #fde68a; }

/* ---------- Portada ---------- */
.cover-logo { position: absolute; left: 150px; top: 120px; height: 92px; }
.cover-eyebrow { position: absolute; left: 156px; top: 330px; color: #fde68a; font: 800 30px/1 'Inter', sans-serif; letter-spacing: .16em; text-transform: uppercase; }
.cover-title { position: absolute; left: 148px; top: 390px; color: #fff; font: 800 120px/1.05 'Poppins', sans-serif; letter-spacing: -.02em; }
.cover-sub { position: absolute; left: 156px; top: 560px; width: 1100px; color: #c7d2fe; font: 600 42px/1.3 'Inter', sans-serif; }
.cover-chips { position: absolute; left: 156px; top: 700px; display: flex; gap: 16px; }
.cover-chips span { padding: 12px 22px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .16); color: #e0e7ff; font: 700 26px/1 'Inter', sans-serif; }
.cover-jiro { position: absolute; left: 1330px; top: 300px; height: 760px; }

/* ---------- Jiro que explica + globo ---------- */
.guide-jiro { position: absolute; left: 40px; top: 330px; height: 740px; }
.bubble {
  position: absolute; left: 470px; top: 92px; width: 1330px; min-height: 196px; padding: 36px 48px;
  background: #fff; color: #111827; border-radius: 40px; box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
  font: 700 50px/1.28 'Poppins', sans-serif;
}
.bubble::after {
  content: ''; position: absolute; left: 70px; bottom: -34px; width: 0; height: 0;
  border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 40px solid #fff; transform: skewX(-22deg);
}
.bubble span[data-typing="true"]::after { content: '|'; color: #2563eb; margin-left: 2px; }

/* Tarjetas de concepto (fondo oscuro) */
.ptype {
  position: absolute; width: 386px; padding: 30px 32px; border-radius: 30px;
  background: rgba(255, 255, 255, .08); border: 2px solid rgba(255, 255, 255, .16);
}
.ptype .big { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; font-size: 44px; }
.ptype h3 { margin: 18px 0 8px; color: #fff; font: 800 36px/1.1 'Poppins', sans-serif; }
.ptype p { margin: 0; color: #c7d2fe; font: 600 27px/1.32 'Inter', sans-serif; }
.flow-arrow { position: absolute; color: #fde68a; font: 800 64px/1 'Poppins', sans-serif; }

/* ---------- Marco de la plataforma ---------- */
.appframe {
  position: absolute; left: 150px; top: 46px; width: 1620px; height: 872px; border-radius: 22px; overflow: hidden;
  background: #f5f7ff; color: #111827; box-shadow: 0 40px 120px rgba(0, 0, 0, .55);
}
.browser { position: absolute; left: 0; top: 0; right: 0; height: 40px; background: #e7eaf4; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.browser i { width: 12px; height: 12px; border-radius: 50%; }
.browser .url { margin-left: 16px; height: 26px; padding: 0 18px; border-radius: 999px; background: #fff; color: #475569; font: 600 14px/26px 'Inter', sans-serif; }
.sidebar { position: absolute; left: 0; top: 40px; width: 280px; bottom: 0; background: #fff; border-right: 1px solid #e5e7eb; }
.band { position: absolute; left: 0; top: 0; right: 0; height: 112px; background: #0b1026; overflow: hidden; }
.band img { position: absolute; left: 16px; top: 12px; height: 36px; }
.band .dot, .night-dots .dot { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .7; }
.classchip { position: absolute; left: 16px; top: 58px; display: flex; align-items: center; gap: 10px; color: #fff; font: 700 16px/1.2 'Inter', sans-serif; }
.classchip b { width: 40px; height: 40px; border-radius: 12px; background: #e11d48; display: grid; place-items: center; font: 800 15px/1 'Inter', sans-serif; }
.classchip small { display: block; margin-top: 3px; font: 700 11px/1 'Inter', sans-serif; color: #c7d2fe; letter-spacing: .06em; }
.nav { position: absolute; left: 14px; right: 14px; top: 124px; }
.nav .item { position: relative; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 10px; color: #334155; font: 600 16px/1 'Inter', sans-serif; }
.nav .item .ic { width: 22px; text-align: center; font-size: 16px; }
.nav .item.sub { padding-left: 38px; font-weight: 500; }
.nav .item.active { background: #eef2ff; color: #3730a3; font-weight: 700; }
.nav .item.active::before { content: '✦'; position: absolute; left: 16px; color: #f59e0b; font-size: 14px; }
.nav .item .chev { margin-left: auto; color: #94a3b8; font-size: 13px; }
.header { position: absolute; left: 280px; right: 0; top: 40px; height: 62px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.header .cls { width: 36px; height: 36px; border-radius: 10px; background: #6366f1; color: #fff; display: grid; place-items: center; font-size: 18px; }
.header .who b { display: block; font: 700 16px/1.2 'Inter', sans-serif; }
.header .who small { color: #64748b; font: 500 13px/1.2 'Inter', sans-serif; }
.header .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.header .tools span { height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; border: 1px solid #e5e7eb; color: #334155; font: 600 14px/1 'Inter', sans-serif; }
.header .tools .av { width: 38px; padding: 0; justify-content: center; border-radius: 50%; background: #e0e7ff; border: 0; font-weight: 800; color: #3730a3; }
.content { position: absolute; left: 280px; right: 0; top: 102px; bottom: 0; background: linear-gradient(135deg, #f8faff, #eef2ff); }
.page { position: absolute; inset: 0; }

/* Piezas de interfaz */
.btn { position: absolute; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #fff; color: #1f2937; font: 700 17px/1 'Inter', sans-serif; }
.btn.inline { position: relative; }
.btn.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
.btn.green { background: #047857; border-color: #047857; color: #fff; }
.btn.outline-blue { border-color: #4f46e5; color: #3730a3; }
.ptitle { position: absolute; left: 32px; top: 30px; display: flex; align-items: center; gap: 16px; }
.ptitle .tile { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; display: grid; place-items: center; font-size: 28px; }
.ptitle h2 { margin: 0; font: 800 28px/1.1 'Inter', sans-serif; }
.ptitle p { margin: 4px 0 0; color: #475569; font: 500 16px/1.2 'Inter', sans-serif; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; }
.seg span { padding: 9px 14px; border-radius: 9px; font: 700 15px/1 'Inter', sans-serif; color: #334155; }
.seg span.on { background: #4f46e5; color: #fff; }
.emptybox { position: absolute; left: 32px; right: 32px; top: 120px; height: 330px; border: 2px dashed #cbd5e1; border-radius: 22px; background: rgba(255, 255, 255, .6); text-align: center; }
.emptybox .emos { margin-top: 50px; display: flex; justify-content: center; gap: 26px; font-size: 44px; }
.emptybox h3 { margin: 18px 0 8px; font: 800 24px/1.2 'Inter', sans-serif; }
.emptybox p { margin: 0 auto; width: 560px; color: #334155; font: 500 17px/1.5 'Inter', sans-serif; }
.emptybox .row { margin-top: 22px; display: flex; justify-content: center; gap: 12px; }
.emptybox .row .btn { position: relative; padding: 0 22px; }
.mpill { display: inline-flex; padding: 5px 10px; border-radius: 999px; font: 800 14px/1 'Inter', sans-serif; }
.mpill.xp { background: #d1fae5; color: #065f46; } .mpill.gp { background: #fef3c7; color: #92400e; } .mpill.hp { background: #fee2e2; color: #991b1b; }
.mpill.rara { background: #dbeafe; color: #1e40af; } .mpill.epica { background: #f3e8ff; color: #6b21a8; } .mpill.comun { background: #f1f5f9; color: #334155; } .mpill.legend { background: #fef3c7; color: #92400e; }
.toast { position: absolute; right: 24px; top: 56px; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 18px; border-radius: 14px; background: #111827; color: #fff; font: 700 17px/1 'Inter', sans-serif; box-shadow: 0 16px 40px rgba(15, 23, 42, .35); z-index: 5; white-space: nowrap; }
.toast.solo { padding-right: 18px; }
.toast .ok { width: 22px; height: 22px; border-radius: 50%; background: #10b981; display: grid; place-items: center; font-size: 13px; }
.toast .undo { margin-left: 8px; padding: 9px 12px; border-radius: 10px; background: #1f2937; border: 1px solid #374151; font: 800 15px/1 'Inter', sans-serif; }
.overlay { position: absolute; left: 0; top: 0; width: 1620px; height: 872px; background: rgba(15, 23, 42, .45); }
.modal { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 30px 80px rgba(15, 23, 42, .35); color: #111827; }
.modal .m { position: absolute; }
.m-title { left: 28px; top: 22px; font: 800 22px/1 'Inter', sans-serif; }
.m-close { right: 26px; top: 20px; color: #64748b; font: 600 22px/1 'Inter', sans-serif; }
.m-label { font: 700 15px/1 'Inter', sans-serif; color: #111827; }
.m-label em { font-style: normal; font-weight: 500; color: #64748b; }
.field { height: 54px; border-radius: 14px; border: 2px solid #e2e8f0; display: flex; align-items: center; padding: 0 18px; font: 600 18px/1 'Inter', sans-serif; color: #111827; background: #fff; }
.field.focus { border-color: #a5b4fc; }
.field .ph { color: #94a3b8; font-weight: 500; }
.field span[data-typing="true"]::after { content: '|'; color: #4f46e5; margin-left: 1px; }
.choice { border-radius: 14px; border: 2px solid #e2e8f0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; color: #1f2937; }
.choice b { font: 800 16px/1.1 'Inter', sans-serif; }
.choice small { color: #64748b; font: 500 13px/1.25 'Inter', sans-serif; }
.choice.on { border-color: #6366f1; background: #eef2ff; }
.m-foot { left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid #f1f5f9; }
.m-foot .btn { top: 10px; height: 44px; font-size: 15px; }

/* ---------- Teléfono del alumno ---------- */
.phone { position: absolute; width: 470px; height: 860px; border-radius: 64px; background: #0f172a; padding: 18px; box-shadow: 0 40px 120px rgba(0, 0, 0, .6); }
.phone .screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: #f8fafc; color: #111827; }
.phone .notch { position: absolute; left: 0; right: 0; top: 10px; margin: 0 auto; width: 140px; height: 30px; border-radius: 999px; background: #0f172a; z-index: 3; }

/* ---------- Cursor, clics, resaltados ---------- */
#cursor { left: 0; top: 0; width: 44px; height: 54px; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); }
.ripple { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid #fbbf24; z-index: 29; }
.glow { position: absolute; border-radius: 16px; box-shadow: 0 0 0 4px #fbbf24, 0 0 40px 10px rgba(251, 191, 36, .45); z-index: 3; pointer-events: none; }

/* ---------- Subtítulos de pasos (centrados con margin: el motor reescribe transform) ---------- */
.capwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.cap {
  position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 1820px; top: 948px; display: flex; align-items: center; gap: 18px;
  padding: 18px 30px 18px 18px; border-radius: 26px; background: rgba(255, 255, 255, .97); color: #111827;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .35); white-space: nowrap; font: 700 34px/1.2 'Inter', sans-serif;
}
.cap .n { min-width: 58px; height: 58px; padding: 0 14px; border-radius: 18px; background: #4f46e5; color: #fff; display: grid; place-items: center; font: 800 28px/1 'Poppins', sans-serif; }
.cap .n.idea { background: #f59e0b; }
.cap .n.ok { background: #047857; }
.cap q { quotes: '«' '»'; color: #3730a3; }

/* ---------- Celebración ---------- */
.celebra { position: absolute; inset: 0; background: rgba(11, 16, 38, .86); }
.confetti { position: absolute; top: 0; width: 16px; height: 26px; border-radius: 4px; }

/* ---------- Consejos y cierre ---------- */
.tips-title { position: absolute; left: 160px; top: 110px; color: #fff; font: 800 84px/1.1 'Poppins', sans-serif; }
.tips-title span { color: #fde68a; }
.tip { position: absolute; left: 160px; width: 1100px; display: flex; align-items: center; gap: 28px; padding: 28px 36px; border-radius: 30px; background: rgba(255, 255, 255, .08); border: 2px solid rgba(255, 255, 255, .15); }
.tip .ck { width: 70px; height: 70px; border-radius: 22px; background: #10b981; color: #fff; display: grid; place-items: center; font: 900 38px/1 'Inter', sans-serif; flex: 0 0 auto; }
.tip b { display: block; color: #fff; font: 800 38px/1.2 'Poppins', sans-serif; }
.tip small { display: block; margin-top: 8px; color: #c7d2fe; font: 600 27px/1.3 'Inter', sans-serif; }
.tips-jiro { position: absolute; left: 1300px; top: 300px; height: 720px; transform-origin: 50% 100%; }
.endcard { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.endcard .box { display: flex; flex-direction: column; align-items: center; }
.endcard img.jiro { height: 460px; }
.endcard h2 { margin: 6px 0 0; color: #fff; font: 800 76px/1.1 'Poppins', sans-serif; }
.endcard p { margin: 18px 0 0; color: #c7d2fe; font: 600 36px/1.3 'Inter', sans-serif; }
.endcard .brand { margin-top: 34px; display: flex; align-items: center; gap: 24px; }
.endcard .brand img { height: 74px; }
.endcard .brand span { color: #fde68a; font: 700 34px/1 'Inter', sans-serif; }


/* Portada para estudiantes (no «Tutorial para docentes») */
.d-logo { position: absolute; left: 150px; top: 120px; height: 92px; }
.d-eyebrow { position: absolute; left: 154px; top: 300px; color: #fde68a; font: 800 30px/1 'Inter', sans-serif; letter-spacing: .18em; text-transform: uppercase; }
.d-title { position: absolute; left: 144px; top: 352px; width: 820px; color: #fff; font: 800 116px/1.02 'Poppins', sans-serif; letter-spacing: -.02em; }
.d-sub { position: absolute; left: 154px; top: 620px; color: #c7d2fe; font: 600 42px/1.3 'Inter', sans-serif; }
.d-chips { position: absolute; left: 154px; top: 720px; display: flex; gap: 16px; }
.d-chips span { padding: 12px 22px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .16); color: #e0e7ff; font: 700 26px/1 'Inter', sans-serif; }
.d-window { position: absolute; left: 1010px; top: 200px; width: 780px; height: 585px; border-radius: 40px; overflow: hidden;
  box-shadow: 0 0 0 4px rgba(253, 230, 138, .35), 0 0 80px rgba(129, 140, 248, .45), 0 40px 120px rgba(0, 0, 0, .5); }
.d-window img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
.zz { position: absolute; color: #e0e7ff; font: 800 52px/1 'Poppins', sans-serif; text-shadow: 0 0 18px rgba(199, 210, 254, .85); }

/* Jiro que cuenta (sus poses cambian en el mismo lugar) */
.jiro-box { position: absolute; left: 40px; top: 330px; width: 560px; height: 740px; }
.jiro-box img { position: absolute; left: 0; bottom: 0; height: 740px; }

/* Luna */
.moon-glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(253, 230, 138, .35), rgba(129, 140, 248, .18) 55%, transparent); }
.moon { position: absolute; }

/* Constelación (Casiopea, con las coordenadas de la actividad) */
.c-panel { position: absolute; left: 980px; top: 330px; width: 860px; height: 602px; }
.c-panel line { stroke: #fde68a; stroke-opacity: .7; stroke-width: .7; stroke-linecap: round; stroke-dasharray: 1; }
.c-off { fill: #c7d2fe; opacity: .55; }
.c-star { transform-box: fill-box; transform-origin: center; }
.c-count { position: absolute; left: 980px; top: 352px; width: 860px; text-align: right; color: #fde68a; font: 800 46px/1 'Poppins', sans-serif; }
.c-pause { position: absolute; left: 1250px; top: 610px; width: 320px; height: 84px; border-radius: 999px; background: rgba(15, 23, 42, .78); border: 3px solid #fda4af;
  display: flex; align-items: center; justify-content: center; gap: 12px; color: #fff; font: 800 40px/1 'Poppins', sans-serif; }
.meter-l { position: absolute; left: 990px; top: 958px; color: #e0e7ff; font: 800 32px/1 'Inter', sans-serif; }
.meter { position: absolute; left: 1130px; top: 960px; width: 640px; height: 30px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.meter b { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: rgba(255, 255, 255, .7); }
.loud { position: absolute; font-size: 64px; }

/* Silencio inicial */
.ear { position: absolute; left: 1210px; top: 360px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(129, 140, 248, .35), rgba(15, 23, 42, .6));
  border: 4px solid rgba(199, 210, 254, .5); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ear .icon { font-size: 110px; line-height: 1; }
.ear .num { margin-top: 8px; color: #fff; font: 800 120px/1 'Poppins', sans-serif; }
.ring { position: absolute; left: 1210px; top: 360px; width: 420px; height: 420px; border-radius: 50%; border: 4px solid #a5b4fc; }
.ear-l { position: absolute; left: 920px; top: 830px; width: 1000px; text-align: center; color: #fde68a; font: 800 50px/1 'Poppins', sans-serif; }

/* Nombre y Cielo de Jiro */
.card { position: absolute; left: 1000px; top: 320px; width: 820px; height: 560px; border-radius: 36px; background: rgba(255, 255, 255, .08); border: 3px solid rgba(253, 230, 138, .45); }
.card h3 { position: absolute; left: 0; right: 0; top: 250px; margin: 0; text-align: center; color: #fde68a; font: 800 54px/1 'Poppins', sans-serif; }
.card .mini { position: absolute; left: 0; right: 0; top: 24px; margin: 0 auto; width: 340px; height: 238px; }
.card .mini line { stroke: #fde68a; stroke-opacity: .7; stroke-width: .7; stroke-linecap: round; }
.card .lbl { position: absolute; left: 60px; top: 330px; color: #e0e7ff; font: 700 30px/1 'Inter', sans-serif; }
.card .field { position: absolute; left: 60px; top: 372px; width: 700px; height: 72px; border-radius: 18px; background: rgba(255, 255, 255, .12); border: 3px solid rgba(255, 255, 255, .35);
  display: flex; align-items: center; padding: 0 24px; color: #fff; font: 700 38px/1 'Poppins', sans-serif; }
.card .field .ph { color: rgba(199, 210, 254, .7); }
.card .field span[data-typing="true"]::after { content: '|'; color: #fde68a; margin-left: 2px; }
.card .save { position: absolute; left: 0; right: 0; top: 466px; margin: 0 auto; width: 560px; height: 70px; border-radius: 18px; background: #fcd34d; color: #451a03;
  display: flex; align-items: center; justify-content: center; font: 800 34px/1 'Poppins', sans-serif; }
.album { position: absolute; left: 980px; top: 900px; width: 860px; height: 160px; border-radius: 28px; background: rgba(255, 255, 255, .06); border: 2px solid rgba(255, 255, 255, .14); }
.album .t { position: absolute; left: 28px; top: 16px; color: #fde68a; font: 800 28px/1 'Poppins', sans-serif; }
.tile { position: absolute; top: 54px; width: 250px; height: 92px; border-radius: 18px; background: rgba(255, 255, 255, .08); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #fff; font: 800 22px/1.1 'Inter', sans-serif; }
.tile svg { width: 96px; height: 68px; flex-shrink: 0; }
.tile.new { border: 3px solid #fcd34d; }
#fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }

/* Final: respirar */
.breath { position: absolute; left: 660px; top: 300px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(closest-side, rgba(253, 230, 138, .32), rgba(129, 140, 248, .22) 55%, transparent); }
.f-jiro { position: absolute; left: 773px; top: 360px; height: 560px; }
.f-big { position: absolute; left: 0; width: 1920px; text-align: center; color: #fde68a; font: 800 120px/1 'Poppins', sans-serif; }
.f-say { position: absolute; left: 0; width: 1920px; text-align: center; color: #fff; font: 800 64px/1 'Poppins', sans-serif; }

<script>
/*
 * Motor de los tutoriales animados de Juried (un archivo HTML por tutorial, sin dependencias).
 *
 * - Escenario fijo de 1920×1080 que se escala a la ventana.
 * - Línea de tiempo determinista: renderAt(t) deja la escena exactamente como debe verse en el segundo t
 *   (sirve para reproducir, adelantar y, si algún día se exporta a MP4, para capturar cuadro por cuadro).
 * - Pistas: key() (opacidad, posición, escala, giro, ancho), type() (texto que se escribe), count() (números),
 *   cue() (sonidos suaves sintetizados con WebAudio, solo al reproducir).
 * - Reproductor: botón grande de inicio, barra con capítulos, tiempo, sonido, pantalla completa y teclado
 *   (espacio, ← →, M, F).
 */
(() => {
  const W = 1920;
  const H = 1080;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const EASE = {
    linear: (k) => k,
    in: (k) => k * k * k,
    out: (k) => 1 - Math.pow(1 - k, 3),
    inOut: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    back: (k) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
    pop: (k) => { const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  };
  const DEFAULTS = { o: 1, x: 0, y: 0, s: 1, r: 0 };
  const $ = (selector) => {
    const el = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!el) throw new Error(`No existe ${selector}`);
    return el;
  };

  const tracks = [];
  const typers = [];
  const counters = [];
  const cues = [];
  const chapters = [];
  const hooks = [];
  let duration = 60;

  /** key(el, [[t, {o, x, y, s, r, w}], ...], ease): los valores que faltan se arrastran del cuadro anterior. */
  const key = (selector, frames, ease = 'inOut') => {
    const el = $(selector);
    const resolved = [];
    let carry = { ...DEFAULTS };
    for (const [t, props] of frames) {
      carry = { ...carry, ...props };
      resolved.push({ t, ...carry, ease: props.ease ?? ease });
    }
    tracks.push({ el, frames: resolved, usesWidth: resolved.some((f) => f.w !== undefined) });
  };
  /** Aparece (y se va) con un fundido y un leve desplazamiento. */
  const show = (selector, t0, t1, { from = { y: 24 }, to = { y: -12 }, fade = 0.45, ease = 'out' } = {}) => {
    const frames = [[t0, { o: 0, ...from }], [t0 + fade, { o: 1, x: 0, y: 0, s: 1, r: 0, ease }]];
    if (t1 !== null && t1 !== undefined) frames.push([t1 - fade, { o: 1 }], [t1, { o: 0, ...to, ease: 'in' }]);
    key(selector, frames, ease);
  };
  /** Texto que se escribe letra por letra entre t0 y t1. */
  const type = (selector, t0, t1, text) => typers.push({ el: $(selector), t0, t1, text });
  /** Número que cuenta de «from» a «to» entre t0 y t1. */
  const count = (selector, t0, t1, from, to, format = (v) => String(Math.round(v))) => counters.push({ el: $(selector), t0, t1, from, to, format });
  /** Sonido suave en el segundo t (pop, chime, whoosh, click, coin, levelup, type, soft, shh, ruido, o 'n:<Hz>'). */
  const cue = (t, sound) => cues.push({ t, sound });
  /** Capítulo en la barra de progreso. */
  const chapter = (t, title) => chapters.push({ t, title });
  /** Función propia que corre en cada cuadro con el segundo t (p. ej. estrellas que titilan). */
  const every = (fn) => hooks.push(fn);

  const applyTrack = (track, t) => {
    const { frames, el } = track;
    let state;
    if (t <= frames[0].t) state = frames[0];
    else if (t >= frames[frames.length - 1].t) state = frames[frames.length - 1];
    else {
      let i = 0;
      while (i < frames.length - 1 && frames[i + 1].t <= t) i++;
      const a = frames[i];
      const b = frames[i + 1];
      const k = (EASE[b.ease] ?? EASE.inOut)(clamp01((t - a.t) / (b.t - a.t)));
      state = { o: lerp(a.o, b.o, k), x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), s: lerp(a.s, b.s, k), r: lerp(a.r, b.r, k) };
      if (track.usesWidth) state.w = lerp(a.w ?? 0, b.w ?? 0, k);
    }
    el.style.opacity = state.o.toFixed(3);
    el.style.visibility = state.o <= 0.001 ? 'hidden' : 'visible';
    el.style.transform = `translate(${state.x.toFixed(1)}px, ${state.y.toFixed(1)}px) scale(${state.s.toFixed(4)}) rotate(${state.r.toFixed(2)}deg)`;
    if (track.usesWidth && state.w !== undefined) el.style.width = `${state.w.toFixed(2)}%`;
  };

  const renderAt = (t) => {
    for (const track of tracks) applyTrack(track, t);
    for (const typer of typers) {
      const k = clamp01((t - typer.t0) / (typer.t1 - typer.t0));
      typer.el.textContent = typer.text.slice(0, Math.round(k * typer.text.length));
      typer.el.dataset.typing = k > 0 && k < 1 ? 'true' : 'false';
    }
    for (const counter of counters) {
      const k = EASE.out(clamp01((t - counter.t0) / (counter.t1 - counter.t0)));
      counter.el.textContent = counter.format(lerp(counter.from, counter.to, k));
    }
    for (const fn of hooks) fn(t);
  };

  // ==================== Sonidos (WebAudio, sin archivos) ====================
  let audio = null;
  let muted = false;
  const ensureAudio = () => {
    if (!audio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audio = new Ctx();
    }
    if (audio.state === 'suspended') void audio.resume();
    return audio;
  };
  const tone = (ctx, { freq, to, start = 0, length = 0.15, type = 'sine', volume = 0.12 }) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const t0 = ctx.currentTime + start;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + length);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + length + 0.02);
  };
  const noise = (ctx, { length = 0.3, from = 300, to = 2400, volume = 0.05 }) => {
    const buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * length), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 1.2;
    const t0 = ctx.currentTime;
    filter.frequency.setValueAtTime(from, t0);
    filter.frequency.exponentialRampToValueAtTime(to, t0 + length);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + length * 0.4);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(t0);
  };
  const SOUNDS = {
    pop: (ctx) => tone(ctx, { freq: 520, to: 880, length: 0.09, volume: 0.1 }),
    click: (ctx) => tone(ctx, { freq: 1800, to: 1200, length: 0.03, type: 'triangle', volume: 0.05 }),
    type: (ctx) => tone(ctx, { freq: 2400, to: 2000, length: 0.018, type: 'triangle', volume: 0.025 }),
    whoosh: (ctx) => noise(ctx, { length: 0.35 }),
    chime: (ctx) => { tone(ctx, { freq: 880, length: 0.5, volume: 0.07 }); tone(ctx, { freq: 1318.5, start: 0.08, length: 0.6, volume: 0.06 }); },
    coin: (ctx) => { tone(ctx, { freq: 987.8, length: 0.08, type: 'triangle', volume: 0.07 }); tone(ctx, { freq: 1318.5, start: 0.07, length: 0.3, type: 'triangle', volume: 0.07 }); },
    levelup: (ctx) => [523.3, 659.3, 784, 1046.5].forEach((freq, i) => tone(ctx, { freq, start: i * 0.09, length: 0.25, type: 'triangle', volume: 0.06 })),
    soft: (ctx) => tone(ctx, { freq: 392, to: 330, length: 0.25, volume: 0.06 }),
    // «Shhh» suave (ruido agudo que se apaga) y el murmullo de un aula ruidosa.
    shh: (ctx) => noise(ctx, { length: 1.5, from: 2600, to: 5200, volume: 0.04 }),
    ruido: (ctx) => noise(ctx, { length: 1.1, from: 380, to: 1300, volume: 0.07 }),
  };
  /** Nota de caja de música: fundamental larga y dos parciales que se apagan antes (como una campanita). */
  const bell = (ctx, freq) => {
    tone(ctx, { freq, length: 1.5, volume: 0.05 });
    tone(ctx, { freq: freq * 2, length: 0.7, volume: 0.016 });
    tone(ctx, { freq: freq * 3, length: 0.3, type: 'triangle', volume: 0.006 });
  };
  /** cue(t, 'n:659.25') toca una nota de caja de música (Hz); el resto, por nombre. */
  const play = (sound) => {
    if (muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    if (sound.startsWith('n:')) bell(ctx, Number(sound.slice(2)));
    else if (SOUNDS[sound]) SOUNDS[sound](ctx);
  };

  // ==================== Reproductor ====================
  const start = ({ length }) => {
    duration = length;
    cues.sort((a, b) => a.t - b.t);
    chapters.sort((a, b) => a.t - b.t);
    const stage = $('#stage');
    const viewport = $('#viewport');
    const bar = $('#bar');
    const range = $('#range');
    const time = $('#time');
    const playButton = $('#play');
    const bigPlay = $('#big-play');
    const muteButton = $('#mute');
    const fullButton = $('#full');
    const chapterLabel = $('#chapter');
    range.max = String(duration);

    for (const chapterInfo of chapters) {
      const tick = document.createElement('button');
      tick.type = 'button';
      tick.className = 'tick';
      tick.style.left = `${(chapterInfo.t / duration) * 100}%`;
      tick.title = chapterInfo.title;
      tick.setAttribute('aria-label', `Ir a: ${chapterInfo.title}`);
      tick.addEventListener('click', () => seek(chapterInfo.t));
      bar.appendChild(tick);
    }

    const fit = () => {
      const scale = Math.min(viewport.clientWidth / W, viewport.clientHeight / H);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    new ResizeObserver(fit).observe(viewport);
    fit();

    let t = 0;
    let playing = false;
    let last = 0;
    const format = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    const ui = () => {
      range.value = String(t);
      range.style.setProperty('--progress', `${(t / duration) * 100}%`);
      time.textContent = `${format(t)} / ${format(duration)}`;
      playButton.setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
      playButton.dataset.playing = String(playing);
      const current = [...chapters].reverse().find((c) => c.t <= t + 0.01);
      chapterLabel.textContent = current ? current.title : '';
      bigPlay.hidden = playing || (t > 0 && t < duration);
      bigPlay.querySelector('span').textContent = t >= duration ? 'Ver de nuevo' : 'Ver tutorial';
    };
    const seek = (to) => {
      t = Math.max(0, Math.min(duration, to));
      renderAt(t);
      ui();
    };
    const toggle = () => {
      if (!playing && t >= duration) t = 0;
      playing = !playing;
      if (playing) ensureAudio();
      last = performance.now();
      ui();
    };
    const loop = (now) => {
      if (playing) {
        const previous = t;
        t = Math.min(duration, t + (now - last) / 1000);
        for (const c of cues) if (c.t > previous && c.t <= t) play(c.sound);
        if (t >= duration) playing = false;
        renderAt(t);
        ui();
      }
      last = now;
      requestAnimationFrame(loop);
    };

    playButton.addEventListener('click', toggle);
    bigPlay.addEventListener('click', toggle);
    range.addEventListener('input', () => seek(Number(range.value)));
    muteButton.addEventListener('click', () => {
      muted = !muted;
      muteButton.dataset.muted = String(muted);
      muteButton.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
    });
    fullButton.addEventListener('click', () => {
      const shell = $('#shell');
      if (document.fullscreenElement) void document.exitFullscreen();
      else void shell.requestFullscreen?.();
    });
    window.addEventListener('keydown', (event) => {
      if (event.target instanceof HTMLInputElement && event.target.type !== 'range') return;
      // Dentro de la plataforma (iframe): Esc cierra el modal que lo contiene.
      if (event.key === 'Escape' && window.parent !== window && !document.fullscreenElement) {
        window.parent.postMessage({ type: 'juried-tutorial:close' }, window.location.origin);
        return;
      }
      if (event.code === 'Space') { event.preventDefault(); toggle(); }
      else if (event.key === 'ArrowRight') seek(t + 5);
      else if (event.key === 'ArrowLeft') seek(t - 5);
      else if (event.key.toLowerCase() === 'm') muteButton.click();
      else if (event.key.toLowerCase() === 'f') fullButton.click();
    });

    // Para revisar o exportar: window.tutorial.renderAt(t) deja la escena del segundo t.
    window.tutorial = { renderAt: (s) => { renderAt(s); }, duration, seek };
    seek(0);
    requestAnimationFrame(loop);
    // ?auto=1: la plataforma lo abre con un clic del docente y arranca solo. Si el navegador aún no deja sonar
    // el audio, el primer toque dentro del video lo habilita.
    if (new URLSearchParams(window.location.search).get('auto') === '1') toggle();
    const wake = () => { if (audio && audio.state === 'suspended') void audio.resume(); };
    window.addEventListener('pointerdown', wake);
    window.addEventListener('keydown', wake);
  };

  window.Motor = { key, show, type, count, cue, chapter, every, start, renderAt };
})();

/*
 * Guion: utilidades compartidas para escribir escenas (usa window.Motor; lo incluye build.mjs con
 * <!-- base: comun -->). Arma las piezas que se repiten entre tutoriales y deja las animaciones estándar:
 *   const G = Guion.init();
 *   G.cielo(); G.portada({...}); G.burbuja(...); const app = G.app({...}); G.caption(...); G.consejos({...});
 *   G.final({...}); G.arrancar(fin);
 * Todo es determinista: las mismas llamadas dan el mismo video.
 */
(() => {
  const GRUPOS = {
    'Estudiantes': { ic: '👥', items: ['Lista', 'Clanes', 'Asistencia'] },
    'Gamificación': { ic: '🎮', items: ['Comportamientos', 'Insignias', 'Tienda', 'Coleccionables', 'Rankings', 'Historia de clase'] },
    'Aprendizaje': { ic: '🎓', items: [] },
    'Comunicación': { ic: '💬', items: [] },
  };

  const init = () => {
    const M = window.Motor;
    const stage = document.getElementById('stage');
    stage.classList.add('loading');
    const $ = (s) => (typeof s === 'string' ? document.querySelector(s) : s);
    let seed = 7;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    /** Crea un elemento (opcionalmente con id) dentro de parent (por defecto, el escenario). */
    const el = (tag, cls = '', html = '', parent = stage, id = '') => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (id) e.id = id;
      if (html) e.innerHTML = html;
      $(parent).appendChild(e);
      return e;
    };

    // ---------- Medidas y animaciones básicas ----------
    /** Centro de un elemento en coordenadas del escenario (sin transformaciones). */
    const center = (selector, dx = 0, dy = 0) => {
      let node = $(selector);
      let x = node.offsetWidth / 2 + dx;
      let y = node.offsetHeight / 2 + dy;
      while (node && node !== stage) { x += node.offsetLeft; y += node.offsetTop; node = node.offsetParent; }
      return { x, y };
    };
    /** Resaltado dorado sobre un elemento. Devuelve el resaltado (oculto hasta que se anime). */
    const glow = (selector, t0, t1, pad = 6, pulse = false) => {
      const target = $(selector);
      const c = center(target);
      const g = el('div', 'glow');
      g.style.cssText = `left:${c.x - target.offsetWidth / 2 - pad}px;top:${c.y - target.offsetHeight / 2 - pad}px;width:${target.offsetWidth + pad * 2}px;height:${target.offsetHeight + pad * 2}px`;
      const frames = [[0, { o: 0 }], [t0, { o: 0 }], [t0 + 0.25, { o: 1 }]];
      if (pulse) frames.push([t0 + 1.1, { o: 0.45 }], [t0 + 2, { o: 1 }]);
      frames.push([t1, { o: 1 }], [t1 + 0.25, { o: 0 }]);
      M.key(g, frames, 'out');
      return g;
    };
    /** Aparece en t0 (y se va en t1 si se indica). */
    const appear = (selector, t0, t1 = null, fade = 0.2) => {
      const frames = [[0, { o: 0 }], [t0, { o: 0 }], [t0 + fade, { o: 1 }]];
      if (t1 !== null) frames.push([t1, { o: 1 }], [t1 + fade, { o: 0 }]);
      M.key(selector, frames, 'out');
    };
    /** Entra con un rebote (escala) en t0 y se va en t1. */
    const pop = (selector, t0, t1 = null, { from = { s: 0.92, y: 20 }, ease = 'back' } = {}) => {
      const frames = [[0, { o: 0, ...from }], [t0, { o: 0, ...from }], [t0 + 0.4, { o: 1, s: 1, y: 0, x: 0, ease }]];
      if (t1 !== null) frames.push([t1, { o: 1 }], [t1 + 0.3, { o: 0, s: 0.97, ease: 'in' }]);
      M.key(selector, frames);
    };
    /** Clic: onda dorada en el punto p y su sonido. */
    const ripple = (t, p) => {
      const r = el('div', 'ripple');
      r.style.left = `${p.x}px`;
      r.style.top = `${p.y}px`;
      M.key(r, [[0, { o: 0 }], [t, { o: 0, s: 0.3 }], [t + 0.02, { o: 0.9, s: 0.35 }], [t + 0.5, { o: 0, s: 1.4, ease: 'out' }]]);
      M.cue(t, 'click');
    };
    /** Texto que se escribe con su tecleo. */
    const typing = (selector, t0, t1, text) => {
      M.type(selector, t0, t1, text);
      for (let t = t0; t < t1; t += 0.085) M.cue(t, 'type');
    };
    /** Subtítulo de paso: número (o ícono) + texto, entre t0 y t1. */
    const caption = (t0, t1, badge, html, kind = '') => {
      const c = el('div', 'cap', `<span class="n ${kind}">${badge}</span><span>${html}</span>`, '#caps');
      M.key(c, [[0, { o: 0, y: 30 }], [t0, { o: 0, y: 30 }], [t0 + 0.35, { o: 1, y: 0, ease: 'out' }], [t1 - 0.3, { o: 1, y: 0 }], [t1, { o: 0, y: -10, ease: 'in' }]]);
    };
    /** Una regla de cuadros del cursor: [[t, punto, {o}?], ...]. */
    const cursor = (frames) => {
      M.key('#cursor', frames.map(([t, p, extra = {}]) => [t, { x: p.x, y: p.y, ...extra, ease: 'inOut' }]));
    };

    // ---------- Fondo ----------
    /** Cielo nocturno con estrellas que titilan y una constelación (visible entre los tramos indicados). */
    const cielo = (constelacion = []) => {
      const sky = el('div', '', '', stage, 'sky');
      stage.insertBefore(sky, stage.firstChild);
      sky.insertAdjacentHTML('beforeend', `<svg id="constellation" viewBox="0 0 600 320" aria-hidden="true">
        <line x1="40" y1="250" x2="150" y2="170"/><line x1="150" y1="170" x2="260" y2="200"/><line x1="260" y1="200" x2="360" y2="90"/>
        <line x1="360" y1="90" x2="470" y2="130"/><line x1="470" y1="130" x2="560" y2="40"/>
        <circle cx="40" cy="250" r="6"/><circle cx="150" cy="170" r="7"/><circle cx="260" cy="200" r="5"/><circle cx="360" cy="90" r="8"/><circle cx="470" cy="130" r="5"/><circle cx="560" cy="40" r="7"/></svg>`);
      const stars = [];
      for (let i = 0; i < 150; i++) {
        const size = rand() < 0.12 ? 4 : rand() < 0.5 ? 3 : 2;
        const s = el('div', 'star', '', sky);
        s.style.cssText = `left:${rand() * 1920}px;top:${rand() * 1080}px;width:${size}px;height:${size}px`;
        stars.push({ el: s, base: 0.35 + rand() * 0.5, speed: 0.6 + rand() * 1.8, phase: rand() * 6.3 });
      }
      M.every((t) => { for (const s of stars) s.el.style.opacity = (s.base + 0.35 * Math.sin(t * s.speed + s.phase)).toFixed(2); });
      const frames = [[0, { o: 0 }]];
      for (const [a, b] of constelacion) frames.push([a, { o: 0 }], [a + 2, { o: 0.8 }], [b - 2, { o: 0.8 }], [b, { o: 0 }]);
      M.key('#constellation', frames);
    };
    /** Puntitos de estrellas dentro de una caja nocturna (banda lateral, tarjeta de avatar…). */
    const puntos = (container, n, w, h) => {
      const box = $(container);
      box.classList.add('night-dots');
      for (let i = 0; i < n; i++) el('i', 'dot', '', box).style.cssText = `left:${rand() * w}px;top:${rand() * h}px`;
    };
    /** Confeti determinista dentro de container desde t0. */
    const confeti = (container, t0, dur = 4) => {
      const colors = ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#a78bfa', '#fb7185'];
      const pieces = [];
      for (let i = 0; i < 70; i++) {
        const c = el('div', 'confetti', '', container);
        c.style.left = `${rand() * 1920}px`;
        c.style.background = colors[i % colors.length];
        pieces.push({ el: c, delay: rand() * 1.2, speed: 380 + rand() * 420, spin: (rand() - 0.5) * 900, drift: (rand() - 0.5) * 220 });
      }
      M.every((t) => {
        for (const c of pieces) {
          const k = t - t0 - c.delay;
          if (k < 0 || k > dur) { c.el.style.opacity = '0'; continue; }
          c.el.style.opacity = '1';
          c.el.style.transform = `translate(${(c.drift * Math.sin(k * 2)).toFixed(1)}px, ${(-60 + k * c.speed).toFixed(1)}px) rotate(${(k * c.spin).toFixed(1)}deg)`;
        }
      });
    };

    // ---------- Escenas estándar ----------
    /** Portada (0 → fin): logo, «Tutorial para docentes», título, subtítulo, chips y Jiro. */
    const portada = ({ titulo, sub, chips = [], jiro, logo, fin = 6.5 }) => {
      const L = el('img', 'cover-logo', '', stage, 'cv-logo'); L.src = logo; L.alt = 'Juried';
      el('div', 'cover-eyebrow', 'Tutorial para docentes', stage, 'cv-eyebrow');
      el('div', 'cover-title', titulo, stage, 'cv-title');
      el('div', 'cover-sub', sub, stage, 'cv-sub');
      el('div', 'cover-chips', chips.map((c) => `<span>${c}</span>`).join(''), stage, 'cv-chips');
      const J = el('img', 'cover-jiro', '', stage, 'cv-jiro'); J.src = jiro; J.alt = '';
      M.show('#cv-logo', 0.2, fin - 0.2, { from: { y: -20 } });
      M.show('#cv-eyebrow', 0.5, fin - 0.2);
      M.key('#cv-title', [[0.8, { o: 0, s: 0.9, y: 30 }], [1.4, { o: 1, s: 1, y: 0, ease: 'pop' }], [fin - 0.5, { o: 1 }], [fin - 0.1, { o: 0, y: -20, ease: 'in' }]]);
      M.show('#cv-sub', 1.5, fin - 0.2);
      M.show('#cv-chips', 2.0, fin - 0.2);
      M.key('#cv-jiro', [[1.0, { o: 0, x: 260 }], [1.8, { o: 1, x: 0, ease: 'back' }], [3.4, { y: -14 }], [4.8, { y: 0 }], [fin - 0.5, { o: 1, x: 0 }], [fin, { o: 0, x: 200, ease: 'in' }]]);
      M.cue(0.3, 'whoosh'); M.cue(1.2, 'pop'); M.cue(1.6, 'chime');
    };
    /** Jiro que explica (entra desde la izquierda). */
    const guia = (id, src, t0, t1) => {
      const J = el('img', 'guide-jiro', '', stage, id); J.src = src; J.alt = '';
      M.key(`#${id}`, [[0, { o: 0, x: -240 }], [t0, { o: 0, x: -240 }], [t0 + 0.7, { o: 1, x: 0, ease: 'back' }], [t1 - 0.6, { o: 1, x: 0 }], [t1, { o: 0, x: -200, ease: 'in' }]]);
      M.cue(t0, 'whoosh');
    };
    /** Globo de Jiro con texto que se escribe. */
    const burbuja = (id, t0, t1, texto) => {
      el('div', 'bubble', `<span id="${id}-t"></span>`, stage, id);
      M.key(`#${id}`, [[0, { o: 0, s: 0.92, y: 20 }], [t0, { o: 0, s: 0.92, y: 20 }], [t0 + 0.4, { o: 1, s: 1, y: 0, ease: 'back' }], [t1 - 0.3, { o: 1 }], [t1, { o: 0 }]]);
      const dur = Math.min(3.2, Math.max(1.6, texto.length * 0.038));
      typing(`#${id}-t`, t0 + 0.5, t0 + 0.5 + dur, texto);
      M.cue(t0 + 0.1, 'pop');
    };
    /** Marco de la plataforma con barra lateral (un menú por cada {id, abierto, activo}). */
    const app = ({ id = 'app', logo, navs }) => {
      const frame = el('div', 'appframe', '', stage, id);
      el('div', 'browser', '<i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#34d399"></i><div class="url">plataformajuried.com</div>', frame);
      const side = el('div', 'sidebar', '', frame);
      const band = el('div', 'band', `<img src="${logo}" alt=""><div class="classchip"><b>3B</b><div>3.° B · Ciencia<small>CÓDIGO W69HBRAN</small></div></div>`, side, `${id}-band`);
      puntos(band, 26, 280, 112);
      for (const n of navs) {
        const nav = el('div', 'nav', '', side, n.id);
        for (const [grupo, info] of Object.entries(GRUPOS)) {
          const open = grupo === n.abierto;
          el('div', 'item', `<span class="ic">${info.ic}</span>${grupo}<span class="chev">${open ? '▴' : '▾'}</span>`, nav);
          if (!open) continue;
          for (const item of info.items) el('div', `item sub${item === n.activo ? ' active' : ''}`, item, nav, item === n.activo ? `${n.id}-on` : '');
        }
      }
      el('div', 'header', '<div class="cls">🎓</div><div class="who"><b>3.° B · Ciencia</b><small>6 estudiantes</small></div><div class="tools"><span>🖥 Modo clase ▾</span><span>🔧 Herramientas</span><span>🔔</span><span class="av">DP</span></div>', frame);
      el('div', 'content', '', frame, `${id}-content`);
      return frame;
    };
    /** Consejos (t0 → t1): título, tres consejos y Jiro. */
    const consejos = ({ t0, t1, items, jiro }) => {
      el('div', 'tips-title', '3 consejos <span>para empezar</span>', stage, 'tp-title');
      items.forEach(([b, small], i) => el('div', 'tip', `<div class="ck">✓</div><div><b>${b}</b><small>${small}</small></div>`, stage, `tp-${i}`).style.top = `${270 + i * 200}px`);
      const J = el('img', 'tips-jiro', '', stage, 'tp-jiro'); J.src = jiro; J.alt = '';
      M.cue(t0, 'whoosh');
      M.show('#tp-title', t0 + 0.3, t1 - 0.4);
      items.forEach((_, i) => {
        const t = t0 + 1 + i * 2;
        M.key(`#tp-${i}`, [[0, { o: 0, x: -60 }], [t, { o: 0, x: -60 }], [t + 0.5, { o: 1, x: 0, ease: 'back' }], [t1 - 0.6, { o: 1, x: 0 }], [t1 - 0.1, { o: 0, x: -40, ease: 'in' }]]);
        M.cue(t, 'pop');
      });
      M.key('#tp-jiro', [[0, { o: 0, x: 200 }], [t0 + 0.6, { o: 0, x: 200 }], [t0 + 1.3, { o: 1, x: 0, ease: 'back' }], [t1 - 0.6, { o: 1, x: 0 }], [t1 - 0.1, { o: 0, x: 160, ease: 'in' }]]);
    };
    /** Cierre (t0 → fin): Jiro, mensaje, ruta en la plataforma, logo y dirección. */
    const final = ({ t0, fin, titulo, ruta, jiro, logo }) => {
      el('div', 'endcard', `<div class="box"><img class="jiro" src="${jiro}" alt=""><h2>${titulo}</h2><p>${ruta}</p><div class="brand"><img src="${logo}" alt="Juried"><span>plataformajuried.com</span></div></div>`, stage, 'end');
      M.key('#end', [[0, { o: 0 }], [t0, { o: 0, s: 0.94 }], [t0 + 0.7, { o: 1, s: 1, ease: 'out' }], [fin - 0.7, { o: 1 }], [fin, { o: 0 }]]);
      M.cue(t0 + 0.2, 'chime');
    };

    /** Cursor, capa de subtítulos y arranque cuando la tipografía está lista (máx. 1,5 s). */
    const capas = () => {
      el('div', 'capwrap', '', stage, 'caps');
      stage.insertAdjacentHTML('beforeend', '<svg id="cursor" class="abs" viewBox="0 0 44 54" aria-hidden="true"><path d="M3 2 L3 40 L13 31 L20 48 L28 44 L21 28 L35 28 Z" fill="#fff" stroke="#111827" stroke-width="3" stroke-linejoin="round"/></svg>');
    };
    const arrancar = (fin) => {
      // Imágenes creadas por el guion con src="asset:…" (build.mjs las dejó como data-asset).
      if (typeof ASSETS !== 'undefined') for (const img of document.querySelectorAll('img[data-asset]')) img.src = ASSETS[img.dataset.asset];
      const go = () => { if (stage.dataset.ready) return; stage.dataset.ready = '1'; stage.classList.remove('loading'); M.start({ length: fin }); };
      if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise((resolve) => setTimeout(resolve, 1500))]).then(go);
      else go();
    };

    return { ...M, $, el, rand, center, glow, appear, pop, ripple, typing, caption, cursor, cielo, puntos, confeti, portada, guia, burbuja, app, consejos, final, capas, arrancar, stage };
  };

  window.Guion = { init };
})();

</script>
<script>

(() => {
  const G = Guion.init();
  const LOGO = ASSETS.a1;
  const END = 47;
  G.chapter(0, 'Inicio');
  G.chapter(6, 'Jiro está cansado');
  G.chapter(13, 'La calma');
  G.chapter(22.5, 'El ruido');
  G.chapter(30, 'El silencio');
  G.chapter(35.5, 'El Cielo de Jiro');
  G.chapter(41.5, '¡A descansar!');

  G.cielo([]);

  // ---------- Caja de música: «Estrellita, ¿dónde estás?» (se calla con el ruido y en el silencio) ----------
  const NOTE = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99, A: 880 };
  const phrase = (t0, notes, beat = 0.75) => {
    let t = t0;
    for (const n of notes) { G.cue(t, `n:${NOTE[n[0]]}`); t += beat * (n.length > 1 ? Number(n.slice(1)) : 1); }
  };
  const P1 = ['C', 'C', 'G', 'G', 'A', 'A', 'G2'];
  const P2 = ['F', 'F', 'E', 'E', 'D', 'D', 'C2'];
  const P3 = ['G', 'G', 'F', 'F', 'E', 'E', 'D2'];
  phrase(0.8, P1);
  phrase(6.8, P2);
  phrase(13.0, P3); // las estrellas 1, 2 y 3 se encienden en F, E y D (14.5, 16, 17.5)
  phrase(19.0, ['G', 'G', 'F', 'F', 'E']); // …y el ruido la corta
  phrase(35.6, P1);
  phrase(41.6, P2, 0.7);

  // =============== 1 · Portada (0–6) ===============
  G.el('img', 'd-logo', '', G.stage, 'd-logo').src = LOGO;
  G.el('div', 'd-eyebrow', 'Observatorio de Jiro', G.stage, 'd-eyebrow');
  G.el('div', 'd-title', 'El Descanso de Jiro', G.stage, 'd-title');
  G.el('div', 'd-sub', '¿Cómo se juega?', G.stage, 'd-sub');
  G.el('div', 'd-chips', '<span>🌙 Calma</span><span>⭐ Estrellas</span><span>🤫 Silencio</span>', G.stage, 'd-chips');
  G.el('div', 'd-window', '<img id="d-cover" data-asset="a2" alt="">', G.stage, 'd-window');
  G.show('#d-logo', 0.2, 5.8, { from: { y: -20 } });
  G.show('#d-eyebrow', 0.5, 5.8);
  G.key('#d-title', [[0.8, { o: 0, s: 0.9, y: 30 }], [1.4, { o: 1, s: 1, y: 0, ease: 'pop' }], [5.5, { o: 1 }], [5.9, { o: 0, y: -20, ease: 'in' }]]);
  G.show('#d-sub', 1.5, 5.8);
  G.show('#d-chips', 2.0, 5.8);
  G.key('#d-window', [[0.9, { o: 0, s: 0.92, x: 120 }], [1.7, { o: 1, s: 1, x: 0, ease: 'back' }], [5.5, { o: 1, s: 1 }], [6.0, { o: 0, s: 0.96, ease: 'in' }]]);
  G.key('#d-cover', [[0.9, { s: 1 }], [6.0, { s: 1.08, ease: 'linear' }]]);
  ['Z', 'z', 'z'].forEach((letter, i) => {
    const z = G.el('div', 'zz', letter, G.stage, `zz${i}`);
    z.style.left = `${1390 + i * 46}px`;
    z.style.top = `${420 - i * 40}px`;
    const t = 2.0 + i * 0.6;
    G.key(z, [[0, { o: 0 }], [t, { o: 0, y: 20, s: 0.7 }], [t + 0.5, { o: 1, y: 0, s: 1 }], [t + 2.2, { o: 0, y: -90, x: 30, s: 1.2, ease: 'out' }]]);
  });
  G.cue(0.3, 'whoosh');
  G.cue(1.2, 'pop');

  // =============== Jiro (6–41.3): bosteza, duerme, se sobresalta, escucha y celebra ===============
  const box = G.el('div', 'jiro-box', '', G.stage, 'jiro');
  // Rutas literales: build.mjs solo cambia 'asset:…' entre comillas simples por la imagen incrustada.
  const poses = {
    desp: ASSETS.a3,
    dorm: ASSETS.a4,
    sobre: ASSETS.a5,
    cele: ASSETS.a6,
  };
  for (const [id, src] of Object.entries(poses)) G.el('img', '', '', box, `j-${id}`).src = src;
  G.key('#jiro', [[0, { o: 0, x: -240 }], [6.1, { o: 0, x: -240 }], [6.8, { o: 1, x: 0, ease: 'back' }], [40.9, { o: 1, x: 0 }], [41.4, { o: 0, x: -200, ease: 'in' }]]);
  G.cue(6.1, 'whoosh');
  // Una sola pose a la vez: [desde, hasta] de cada una.
  const poseAt = { desp: [[6, 13], [30, 35.5]], dorm: [[13, 22.6], [26.5, 30]], sobre: [[22.6, 26.5]], cele: [[35.5, 41.5]] };
  for (const [id, spans] of Object.entries(poseAt)) {
    const frames = [[0, { o: 0 }]];
    for (const [a, b] of spans) frames.push([a, { o: 0 }], [a + 0.18, { o: 1 }], [b - 0.18, { o: 1 }], [b, { o: 0 }]);
    G.key(`#j-${id}`, frames, 'linear');
  }

  // =============== 2 · Jiro está cansado (6–13) ===============
  G.burbuja('b1', 6.6, 12.8, '¡Hola! Pasé toda la noche cuidando las estrellas… ¡y estoy muy cansado!');
  G.el('div', 'moon-glow', '', G.stage, 'moon-glow').style.cssText = 'left:1180px;top:330px;width:560px;height:560px';
  G.el('div', 'moon', `<svg viewBox="0 0 200 200" width="420" height="420"><defs><radialGradient id="mg" cx="35%" cy="35%" r="80%"><stop offset="0" stop-color="#fffbeb"/><stop offset=".6" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient></defs><path d="M118 16 A86 86 0 1 0 184 142 A70 70 0 0 1 118 16 Z" fill="url(#mg)"/></svg>`, G.stage, 'moon').style.cssText = 'left:1250px;top:400px';
  G.key('#moon-glow', [[0, { o: 0 }], [7.2, { o: 0, s: 0.8 }], [8.2, { o: 1, s: 1, ease: 'out' }], [12.6, { o: 1 }], [13.0, { o: 0 }]]);
  G.key('#moon', [[0, { o: 0 }], [7.2, { o: 0, y: 40 }], [8.2, { o: 1, y: 0, ease: 'out' }], [10.2, { y: -14 }], [12.2, { y: 0 }], [12.6, { o: 1 }], [13.0, { o: 0 }]]);

  // =============== 3 y 4 · La calma dibuja; el ruido pausa (13–30) ===============
  G.burbuja('b2', 13.3, 22.4, 'Cuando el aula está en calma, me duermo… y en mis sueños dibujo una constelación.');
  G.burbuja('b3', 22.7, 26.4, '¡Shh! Si hay ruido, casi me despierto… y el dibujo se detiene.');
  G.burbuja('b4', 26.6, 29.9, 'Cuando vuelve la calma, sigo… ¡y nunca se pierden estrellas!');

  // Casiopea (constellations.ts): estrellas y líneas en el lienzo 100 × 70 de la actividad.
  const STARS = [{ x: 12, y: 28, r: 2 }, { x: 30, y: 50, r: 2.2 }, { x: 48, y: 34, r: 2.4 }, { x: 66, y: 54, r: 2 }, { x: 86, y: 26, r: 2 }];
  const LINES = [[0, 1], [1, 2], [2, 3], [3, 4]];
  const LIT = [14.5, 16.0, 17.5, 27.8, 29.0];
  const svgStars = (lit) => `${LINES.map(([a, b], i) => `<line data-l="${i}" x1="${STARS[a].x}" y1="${STARS[a].y}" x2="${STARS[b].x}" y2="${STARS[b].y}" pathLength="1"${lit ? ' style="stroke-dashoffset:0"' : ''}/>`).join('')}
    ${STARS.map((s, i) => `<circle class="c-off" cx="${s.x}" cy="${s.y}" r="${s.r * 0.6}"/><circle id="${lit ? '' : `halo${i}`}" cx="${s.x}" cy="${s.y}" r="${s.r}" fill="#fde68a" opacity="0"/>
      <g class="c-star" ${lit ? '' : `id="star${i}"`}><circle cx="${s.x}" cy="${s.y}" r="${s.r * 2.4}" fill="#fde68a" opacity=".22"/><circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="#fef3c7"/></g>`).join('')}`;
  G.el('div', 'c-panel', `<svg viewBox="0 0 100 70" width="860" height="602">${svgStars(false)}</svg>`, G.stage, 'panel');
  G.el('div', 'c-count', '', G.stage, 'count');
  G.el('div', 'c-pause', '⏸ Pausa', G.stage, 'pause');
  G.el('div', 'meter-l', 'Ruido', G.stage, 'meter-l');
  G.el('div', 'meter', '<i id="m-ok" style="background:#6ee7b7"></i><i id="m-loud" style="background:#fda4af"></i><b></b>', G.stage, 'meter');
  ['🔊', '📢', '🔊'].forEach((e, i) => { G.el('div', 'loud', e, G.stage, `loud${i}`).style.cssText = `left:${1320 + i * 170}px;top:${790 + (i % 2) * 40}px`; });

  const panelOn = [[0, { o: 0 }], [13.4, { o: 0, s: 0.95 }], [14.0, { o: 1, s: 1, ease: 'out' }], [22.8, { o: 1 }], [23.1, { o: 0.55 }], [26.5, { o: 0.55 }], [26.8, { o: 1 }], [29.8, { o: 1 }], [30.2, { o: 0 }]];
  G.key('#panel', panelOn);
  G.key('#count', [[0, { o: 0 }], [14.2, { o: 0 }], [14.6, { o: 1 }], [29.8, { o: 1 }], [30.2, { o: 0 }]]);
  G.key('#pause', [[0, { o: 0 }], [23.1, { o: 0, s: 0.8 }], [23.4, { o: 1, s: 1, ease: 'back' }], [26.3, { o: 1 }], [26.6, { o: 0, s: 0.9 }]]);
  G.key('#meter-l', [[0, { o: 0 }], [21.6, { o: 0 }], [22.0, { o: 1 }], [29.8, { o: 1 }], [30.2, { o: 0 }]]);
  G.key('#meter', [[0, { o: 0 }], [21.6, { o: 0 }], [22.0, { o: 1 }], [29.8, { o: 1 }], [30.2, { o: 0 }]]);
  G.key('#m-ok', [[0, { w: 12, o: 1 }], [22.9, { w: 14, o: 1 }], [23.3, { w: 88, o: 0 }], [26.3, { w: 88, o: 0 }], [26.9, { w: 16, o: 1 }], [29, { w: 10, o: 1 }]]);
  G.key('#m-loud', [[0, { w: 12, o: 0 }], [22.9, { w: 14, o: 0 }], [23.3, { w: 88, o: 1 }], [24.4, { w: 70, o: 1 }], [25.4, { w: 92, o: 1 }], [26.3, { w: 88, o: 1 }], [26.9, { w: 16, o: 0 }]]);
  [0, 1, 2].forEach((i) => {
    const t = 22.9 + i * 0.15;
    G.key(`#loud${i}`, [[0, { o: 0 }], [t, { o: 0, s: 0.6 }], [t + 0.25, { o: 1, s: 1.15, ease: 'back' }], [t + 0.7, { s: 0.95, r: i % 2 ? 8 : -8 }], [t + 1.2, { s: 1.1, r: 0 }], [26.2, { o: 1 }], [26.5, { o: 0 }]]);
  });
  G.cue(22.9, 'ruido'); G.cue(24.0, 'ruido'); G.cue(25.1, 'ruido');
  G.cue(27.8, 'n:1318.51'); G.cue(29.0, 'n:1567.98');

  // Estrellas: «pop» al encenderse; líneas que se trazan; la 4.ª se «carga» con la calma y se congela con el ruido.
  LIT.forEach((t, i) => G.key(`#star${i}`, [[0, { o: 0, s: 0.2 }], [t, { o: 0, s: 0.2 }], [t + 0.35, { o: 1, s: 1.5, ease: 'out' }], [t + 0.7, { o: 1, s: 1 }]]));
  const lines = [...G.stage.querySelectorAll('#panel line')];
  const calm = (t) => { // segundos de calma desde que se encendió la 3.ª (el ruido no cuenta)
    const until = (a, b) => Math.max(0, Math.min(t, b) - a);
    return until(17.5, 22.6) + until(26.6, 27.8);
  };
  G.every((t) => {
    LINES.forEach(([, b], i) => {
      const k = Math.max(0, Math.min(1, (t - LIT[b] - 0.2) / 0.6));
      lines[i].style.strokeDashoffset = String(1 - k);
    });
    const halo = G.$('#halo3');
    const k = t >= LIT[3] ? 0 : Math.min(1, calm(t) / 6.2);
    halo.setAttribute('r', String(STARS[3].r * (1 + k * 1.8)));
    halo.setAttribute('opacity', String((0.08 + 0.2 * k) * (k > 0 ? 1 : 0)));
    const lit = LIT.filter((s) => s <= t).length;
    const paused = t >= 23.0 && t < 26.5;
    G.$('#count').textContent = `${lit} de 5 ⭐${paused ? ' · en pausa' : ''}`;
  });

  // =============== 5 · El silencio inicial (30–35.5) ===============
  G.burbuja('b5', 30.3, 35.3, 'Antes de empezar, escucho 10 segundos el silencio del aula. ¡Shh…!');
  [0, 1, 2].forEach((i) => G.el('div', 'ring', '', G.stage, `ring${i}`));
  G.el('div', 'ear', '<div class="icon">👂</div><div class="num" id="cd">10</div>', G.stage, 'ear');
  G.el('div', 'ear-l', 'Escucho el silencio del aula…', G.stage, 'ear-l');
  G.key('#ear', [[0, { o: 0 }], [30.4, { o: 0, s: 0.85 }], [30.9, { o: 1, s: 1, ease: 'back' }], [35.1, { o: 1 }], [35.5, { o: 0, s: 0.95 }]]);
  G.key('#ear-l', [[0, { o: 0 }], [31.0, { o: 0 }], [31.4, { o: 1 }], [35.1, { o: 1 }], [35.5, { o: 0 }]]);
  // Cuenta pareja (10 → 0), un número por cada 0,38 s, con su tic.
  for (let k = 1; k <= 10; k += 1) G.cue(31.0 + (3.8 * k) / 10, 'click');
  G.cue(34.9, 'chime');
  G.every((t) => {
    G.$('#cd').textContent = String(Math.max(0, Math.min(10, Math.ceil(10 - (t - 31.0) / 0.38 - 1e-6))));
  });
  G.every((t) => {
    for (let i = 0; i < 3; i += 1) {
      const ring = G.$(`#ring${i}`);
      const on = t > 30.9 && t < 35.1;
      const phase = (((t - 30.9) / 1.5) + i / 3) % 1;
      ring.style.opacity = on ? String((0.6 * (1 - phase)).toFixed(3)) : '0';
      ring.style.transform = `scale(${(0.9 + 0.7 * phase).toFixed(3)})`;
    }
  });

  // =============== 6 · Ustedes le ponen nombre: Cielo de Jiro (35.5–41.5) ===============
  G.burbuja('b6', 35.7, 41.3, 'Al completarla, ustedes le ponen nombre… ¡y queda para siempre en el Cielo de Jiro!');
  G.el('div', 'card', `<svg class="mini" viewBox="0 0 100 70">${svgStars(true)}</svg><h3>¡Completamos Casiopea!</h3>
    <div class="lbl">¿Cómo la llama la clase?</div>
    <div class="field"><span class="ph" id="nm-ph">Casiopea</span><span id="nm" style="position:absolute;left:24px"></span></div>
    <div class="save" id="save">✓ Guardar en el Cielo de Jiro</div>`, G.stage, 'card');
  const mini = (stars, lines) => `<svg viewBox="0 0 100 70">${lines.map(([a, b]) => `<line x1="${stars[a].x}" y1="${stars[a].y}" x2="${stars[b].x}" y2="${stars[b].y}" stroke="#fde68a" stroke-opacity=".7" stroke-width="1.4"/>`).join('')}${stars.map((s) => `<circle cx="${s.x}" cy="${s.y}" r="${s.r * 1.3}" fill="#fef3c7"/>`).join('')}</svg>`;
  const CRUZ = [{ x: 50, y: 8, r: 2.2 }, { x: 52, y: 62, r: 2.8 }, { x: 30, y: 32, r: 2.4 }, { x: 70, y: 28, r: 1.8 }, { x: 62, y: 44, r: 1.4 }];
  const ORION = [{ x: 32, y: 16, r: 2.8 }, { x: 66, y: 20, r: 2.2 }, { x: 48, y: 6, r: 1.4 }, { x: 42, y: 42, r: 1.8 }, { x: 50, y: 40, r: 1.8 }, { x: 58, y: 38, r: 1.8 }, { x: 36, y: 64, r: 2 }, { x: 70, y: 62, r: 2.8 }];
  G.el('div', 'album', `<div class="t">✨ Cielo de Jiro</div>
    <div class="tile" style="left:24px">${mini(CRUZ, [[0, 1], [2, 3]])}<span>Cruz del Sur</span></div>
    <div class="tile" style="left:300px">${mini(ORION, [[2, 0], [2, 1], [0, 3], [1, 5], [3, 4], [4, 5], [3, 6], [5, 7]])}<span>Los guerreros</span></div>
    <div class="tile new" id="tile-new" style="left:576px">${mini(STARS, LINES)}<span>La W de 4.°&nbsp;B</span></div>`, G.stage, 'album');
  G.el('div', '', '', G.stage, 'fx');
  G.key('#card', [[0, { o: 0 }], [35.8, { o: 0, s: 0.92, y: 30 }], [36.3, { o: 1, s: 1, y: 0, ease: 'back' }], [39.2, { o: 1, s: 1, x: 0, y: 0 }], [39.9, { o: 0, s: 0.3, x: 70, y: 440, ease: 'in' }]]);
  G.key('#album', [[0, { o: 0 }], [36.4, { o: 0, y: 30 }], [36.9, { o: 1, y: 0, ease: 'out' }], [41.0, { o: 1 }], [41.4, { o: 0 }]]);
