.pstats { position: absolute; left: 32px; top: 96px; display: flex; gap: 14px; }

.pfilters { position: absolute; left: 32px; top: 192px; display: flex; gap: 10px; }
.pfilters span { height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; display: inline-flex; align-items: center; font: 700 14px/1 'Inter', sans-serif; }

/* Teléfono: sobres y caja */
.ph-top { position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(135deg, #0b1026, #312e81); color: #fff; padding: 62px 26px 0; }

.envelope { position: absolute; left: 0; right: 0; top: 190px; margin: 0 auto; width: 210px; height: 270px; border-radius: 12px; background: linear-gradient(160deg, #fde68a, #f59e0b 60%, #d97706); box-shadow: 0 16px 40px rgba(180, 83, 9, .4); }

.cost { position: absolute; left: 0; right: 0; top: 482px; text-align: center; color: #475569; font: 700 15px/1.3 'Inter', sans-serif; }

.deal { position: absolute; left: 16px; right: 16px; top: 200px; display: flex; justify-content: space-between; }

.lab.nueva { color: #047857; } .lab.rep { color: #b45309; }
.summary { position: absolute; left: 24px; right: 24px; top: 380px; padding: 16px; border-radius: 18px; background: #fff; border: 1px solid #e2e8f0; text-align: center; color: #1f2937; font: 700 16px/1.4 'Inter', sans-serif; }

.brow b { display: block; font: 800 16px/1.2 'Inter', sans-serif; }
.brow small { display: block; margin-top: 3px; color: #64748b; font: 600 13px/1 'Inter', sans-serif; }
.brow .go { margin-left: auto; height: 42px; padding: 0 14px; border-radius: 12px; background: #4f46e5; color: #fff; display: grid; place-items: center; font: 800 14px/1 'Inter', sans-serif; }
.brow .go.soft { background: #eef2ff; color: #3730a3; }

<script>
(() => {
  const G = Guion.init();
  const LOGO = 'asset:logo.png?h=200';
  const END = 82;
  G.chapter(0, 'Inicio');
  G.chapter(6.5, '¿Qué son?');
  G.chapter(19, 'Crear un álbum');
  G.chapter(46, 'Sobres y la caja');
  G.chapter(68, 'Consejos');

  // Figurita en HTML (rareza: comun | poco | rara | epica | legend)
  const R = { comun: 'Común', poco: 'Poco común', rara: 'Rara', epica: 'Épica', legend: 'Legendaria' };
  const card = (n, emo, name, r, size = '', id = '') => `<div class="card ${size} r-${r}"${id ? ` id="${id}"` : ''}><span class="num">${n}</span><div class="emo">${emo}</div><div class="foot"><b>${name}</b><span>${R[r]}</span></div></div>`;
  const empty = (n, name, size = '') => `<div class="card ${size} empty"><span class="num">${n}</span><div class="foot"><b>${name}</b></div></div>`;

  // =============== A · Portada (0–6.5) ===============
  G.cielo([[0, 19], [68, 82]]);
  G.portada({ titulo: 'Coleccionables', sub: 'Álbumes de figuritas que tus estudiantes completan', chips: ['⏱ 1 minuto', '📖 Gamificación'], jiro: 'asset:assets/jiro/emocionado.webp', logo: LOGO });

  // =============== B · ¿Qué son? (6.5–19) ===============
  G.guia('b-jiro', 'asset:assets/jiro/senalando.webp', 6.6, 19);
  G.burbuja('b-b1', 7.0, 12.8, 'Tus estudiantes abren sobres con su oro y pegan figuritas en su álbum.');
  const leftCards = [[1, '🦁', 'León', 'rara'], [2, '🐘', 'Elefante', 'comun'], [3, '🦒', 'Jirafa', 'poco'], [4, '🐼', 'Panda', 'epica'], [5, '', 'Cebra', ''], [6, '', 'Tigre', '']];
  const rightCards = [[7, '🐧', 'Pingüino', 'comun'], [8, '', 'Koala', ''], [9, '🦅', 'Águila', 'legend'], [10, '', 'Delfín', ''], [11, '', 'Búho', ''], [12, '', 'Lobo', '']];
  const pageHtml = (list) => list.map(([n, e, nm, r]) => (r ? card(n, e, nm, r, 'md') : empty(n, nm, 'md'))).join('');
  G.el('div', 'book', `<div class="bpage">${pageHtml(leftCards)}</div><div class="bpage right">${pageHtml(rightCards)}</div>`, G.stage, 'book');
  G.key('#book', [[0, { o: 0, y: 40, s: 0.94 }], [9.2, { o: 0, y: 40, s: 0.94 }], [9.8, { o: 1, y: 0, s: 1, ease: 'out' }], [18.4, { o: 1 }], [18.9, { o: 0, y: -20, ease: 'in' }]]);
  [...G.$('#book').querySelectorAll('.card:not(.empty)')].forEach((c, i) => {
    const t = 10.0 + i * 0.3;
    G.key(c, [[0, { o: 0, s: 0.6 }], [t, { o: 0, s: 0.6 }], [t + 0.3, { o: 1, s: 1, ease: 'pop' }]]);
    G.cue(t, 'pop');
  });
  G.burbuja('b-b2', 13.0, 19, 'Al completarlo ganan un premio. ¡Y comparten las repetidas!');
  [['🎁', '#f59e0b', 'Sobres de 5', 'Con su oro, hasta 2 al día.'], ['🏆', '#6366f1', 'Premio', 'Insignia u oro al completarlo.'], ['📦', '#10b981', 'Caja de la clase', 'Donan repetidas; otro compañero las toma.']].forEach(([ic, bg, h, p], i) => {
    const c = G.el('div', 'ptype', `<div class="big" style="background:${bg}">${ic}</div><h3>${h}</h3><p>${p}</p>`, G.stage, `b-c${i}`);
    c.style.cssText += `left:${600 + i * 410}px;top:716px`;
    const t = 14.6 + i * 0.5;
    G.key(c, [[0, { o: 0, y: 50 }], [t, { o: 0, y: 50 }], [t + 0.45, { o: 1, y: 0, ease: 'back' }], [18.4, { o: 1 }], [18.9, { o: 0, y: 30, ease: 'in' }]]);
    G.cue(t, 'pop');
  });

  // =============== C y D · La plataforma (19–68) ===============
  const frame = G.app({ id: 'app', logo: LOGO, navs: [{ id: 'nav-gam', abierto: 'Gamificación', activo: 'Coleccionables' }] });
  const C = '#app-content';
  // Lista vacía
  G.el('div', 'page', `
    <div class="ptitle"><div class="tile" style="background:linear-gradient(135deg,#d97706,#92400e)">📖</div><div><h2>Coleccionables</h2><p>Álbumes de figuritas que tus estudiantes completan abriendo sobres</p></div></div>
    <div class="btn" style="left:834px;top:32px;width:130px">⬇ Importar</div>
    <div class="btn" style="left:976px;top:32px;width:160px">✨ Crear con IA</div>
    <div class="btn primary" style="left:1148px;top:32px;width:160px">＋ Nuevo álbum</div>
    <div class="emptybox"><div class="emos"><span>📖</span></div><h3>Crea tu primer álbum</h3><p>Tus estudiantes abren sobres con su oro, pegan las figuritas y ganan un premio al completarlo.</p><div class="row"><div class="btn inline primary">✨ Crear con IA</div><div class="btn inline" id="b-mano">＋ Crear a mano</div></div></div>
  `, C, 'pg-list');
  // Detalle del álbum
  const aiCards = [[2, '🐘', 'Elefante', 'comun'], [3, '🦒', 'Jirafa', 'poco'], [4, '🐼', 'Panda', 'epica'], [5, '🦓', 'Cebra', 'comun'], [6, '🐯', 'Tigre', 'rara'], [7, '🐧', 'Pingüino', 'comun'], [8, '🐨', 'Koala', 'poco'], [9, '🦅', 'Águila', 'legend'], [10, '🐬', 'Delfín', 'rara'], [11, '🦉', 'Búho', 'comun'], [12, '🐺', 'Lobo', 'poco'], [13, '🦜', 'Loro', 'comun']];
  G.el('div', 'page', `
    <div class="aheader"><span style="font-size:22px">←</span><h2>Animales del mundo</h2><span class="badge">A la venta</span><div class="acts"><span>📖 Hojear álbum</span><span id="b-prog">👥 Progreso</span><span>··· Más</span></div></div>
    <div class="stats">
      <div class="stat"><small>FIGURITAS</small><b id="n-cards">0</b><em id="n-pages">1 página</em></div>
      <div class="stat"><small>SOBRE</small><b>20 de oro</b><em>de 5 · hasta 2 al día</em></div>
      <div class="stat"><small>COMPLETARLO</small><b id="n-cost">—</b><em id="n-cost2">añade figuritas</em><div class="alt" id="cost-full"><small>COMPLETARLO</small><b>~90 de oro</b><em>≈ 2,3 semanas de oro</em></div></div>
      <div class="stat"><small>PREMIO</small><b>🦁 Insignia</b><em>al completarlo</em></div>
    </div>
    <div class="addrow"><span id="b-addcard">＋ Añadir figurita</span><span id="b-addia">✨ Añadir con IA</span></div>
    <div class="agrid" id="agrid">${card(1, '🦁', 'León', 'rara', 'md', 'c-leon')}${aiCards.map(([n, e, nm, r]) => card(n, e, nm, r, 'md', `c-ai${n}`)).join('')}</div>
  `, C, 'pg-album');
  // Progreso
  const prog = [['Ana', 100, '13 de 13 ✓'], ['Bruno', 77, '10 de 13'], ['Carla', 62, '8 de 13'], ['Diego', 46, '6 de 13'], ['Elsa', 38, '5 de 13'], ['Fabio', 23, '3 de 13']];
  G.el('div', 'page', `
    <div class="prog-h"><h2>Progreso · Animales del mundo</h2><p>Quién colecciona y a quién le faltan figuritas</p></div>
    <div class="pstats"><div><small>PROMEDIO</small><b>58%</b></div><div><small>COMPLETARON</small><b>1</b></div><div><small>COLECCIONAN</small><b>6</b></div></div>
    <div class="pfilters"><span class="on">Todos</span><span>A punto (75%+)</span><span>Completados</span><span>Sin figuritas</span></div>
    <div class="plist">${prog.map(([n, p, l], i) => `<div class="prow">${n}<div class="pb"><i id="pb-${i}" style="width:${p}%"></i></div><em>${l}</em></div>`).join('')}</div>
  `, C, 'pg-prog');
  G.el('div', 'toast', '<span class="ok">✓</span>Álbum creado: Animales del mundo', C, 'toast-a').classList.add('solo');
  G.el('div', 'toast', '<span class="ok">✓</span>Pegado en el álbum: León', C, 'toast-p').classList.add('solo');

  // Modal «Nuevo álbum»
  G.el('div', 'overlay', '', frame, 'ov');
  G.el('div', 'modal', `
    <div class="m m-title">Nuevo álbum</div><div class="m m-close">✕</div>
    <div class="m portada">🖼<br>Portada</div>
    <div class="m m-label" style="left:172px;top:70px">Nombre</div>
    <div class="m field focus" id="al-name" style="left:172px;top:92px;width:444px"><span class="ph" id="al-ph">Ej: Animales del mundo</span><span id="al-typed" style="position:absolute;left:18px"></span></div>
    <div class="m m-label" style="left:172px;top:162px">Descripción <em>(opcional)</em></div>
    <div class="m field" style="left:172px;top:184px;width:444px;height:48px;font-size:15px"><span class="ph">De qué trata el álbum</span></div>
    <div class="m m-label" style="left:24px;top:256px">Precio de los sobres</div>
    <div class="m" style="left:24px;top:278px"><div class="seg"><span>Más barato</span><span class="on">Normal</span><span>Más caro</span></div></div>
    <div class="m info-box" style="top:336px"><b>📦 Sobre de 5: 20 de oro · hasta 2 al día</b><br>Calculado con el oro que gana tu clase (unos 40 de oro por semana), como la ropa del avatar. En cada sobre, 1 de cada 5 figuritas sale repetida.</div>
    <div class="m m-label" style="left:24px;top:428px">Premio al completarlo</div>
